<ion-item class="no-border">
  <ion-thumbnail slot="start">
    <img alt="Silhouette of mountains" [src]="image" width="50" height="50" />
  </ion-thumbnail>
  <ion-label
    ><h2>{{ title }}</h2>
    <p>{{ subtitle }}</p></ion-label
  >
  <ion-label slot="end">
    <p>{{ duration }}</p>
  </ion-label>
  @if(styles !== 'user'){
    <ion-icon slot="end" name="ellipsis-horizontal"></ion-icon>
  }
  
</ion-item>
